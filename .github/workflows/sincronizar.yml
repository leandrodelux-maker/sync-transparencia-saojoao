name: Sincronizar Portal da Transparência

# Copia os dados do portal Megasoft para o banco analítico (Supabase) que o site lê.
# Repositório público: os minutos do GitHub Actions não são cobrados.
# As chaves ficam em Settings › Secrets and variables › Actions (nunca no código):
#   Secrets:   FIRECRAWL_API_KEY, TRANSPARENCIA_SUPABASE_SERVICE_ROLE_KEY
#   Variables: TRANSPARENCIA_SUPABASE_URL, PORTAL_BASE_URL

on:
  schedule:
    - cron: "0 6 * * *"   # todos os conjuntos: todo dia às 06:00 UTC (03:00 em Brasília)
    - cron: "30 * * * *"  # só o resumo (totais da página inicial): de hora em hora
  workflow_dispatch:
    inputs:
      dataset:
        description: "Conjunto (ex.: despesas) ou 'todos'"
        default: "todos"
        required: true
      ano:
        description: "Ano (vazio = ano atual)"
        default: ""
        required: false

concurrency:
  group: sincronizar
  cancel-in-progress: false

permissions:
  contents: write   # só para o passo "manter ativo" abaixo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # "todos" inclui folha mês a mês, dispensas e ordens com detalhe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sincronizar
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TRANSPARENCIA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRANSPARENCIA_SUPABASE_SERVICE_ROLE_KEY }}
          TRANSPARENCIA_SUPABASE_URL: ${{ vars.TRANSPARENCIA_SUPABASE_URL }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
          DATASET: ${{ github.event.schedule == '30 * * * *' && 'resumo' || github.event.inputs.dataset || 'todos' }}
        run: node sync.mjs "$DATASET" "${{ github.event.inputs.ano }}"

      # O GitHub desliga os agendamentos de repositório público que fica 60 dias sem commit.
      # Na rodada diária, se o último commit tiver mais de 45 dias, grava um commit vazio.
      - name: Manter o agendamento ativo
        if: always() && github.event.schedule == '0 6 * * *'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantém o agendamento ativo"
            git push
          fi
